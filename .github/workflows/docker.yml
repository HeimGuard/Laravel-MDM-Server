name: Docker image

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image is only built (and pushed) when the tests of the same workflow run pass.
  #
  # Database of the tests: a SQLite FILE instead of ":memory:". With an in-memory database RefreshDatabase
  # runs all migrations again for every test; with a file it migrates once per process and wraps every test in a
  # transaction that is rolled back. Safe for this suite: no test commits on its own, opens a second connection or
  # reads the file from outside. The two kinds that do not fit a transaction (a test that changes the schema, the
  # SQLite import) are in the group `fresh-db` and run in a separate step on the old in-memory database.
  # The `env:` of a step wins over phpunit.xml (its <env> has no force="true"), so running the tests locally is unchanged.
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/laravel/package-lock.json

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('src/laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - run: npm run build

      - run: cp .env.example .env && php artisan key:generate

      # PHPUnit directly: `php artisan test --exclude-group=...` ignores the option (the first CI run executed all 444
      # tests in this job). Everything but the slow group runs on the SQLite file, the schema is migrated once and each
      # test runs in a transaction (the tests of the group fresh-db pass there too).
      - name: Tests (SQLite file, migrated once)
        run: |
          touch "$DB_DATABASE"
          php -d memory_limit=-1 vendor/bin/phpunit --exclude-group=slow
        env:
          DB_DATABASE: ${{ runner.temp }}/testing.sqlite

  # The slow tests (wall-clock based performance test) run in parallel to the others.
  slow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/laravel/package-lock.json

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('src/laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - run: npm run build

      - run: cp .env.example .env && php artisan key:generate

      - name: Slow tests
        run: |
          touch "$DB_DATABASE"
          php -d memory_limit=-1 vendor/bin/phpunit --group=slow
        env:
          DB_DATABASE: ${{ runner.temp }}/testing.sqlite

  # The same tests on PostgreSQL (CLAUDE.md lists what only PostgreSQL rejects). Nobody has run the suite there in CI
  # yet, so failures are expected: `continue-on-error` keeps this job from failing the workflow and `build` does not
  # need it. Remove `continue-on-error` once it is green. The `fresh-db` group is left out (the SQLite import test is
  # specific to SQLite); the slow group runs on SQLite only.
  tests-pgsql:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: src/laravel
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heimguard_test
          POSTGRES_USER: heimguard
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heimguard -d heimguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_pgsql, pgsql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/laravel/package-lock.json

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('src/laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: npm ci

      - run: npm run build

      - run: cp .env.example .env && php artisan key:generate

      - name: Tests (PostgreSQL)
        # fresh-db: the tests of the SQLite import and the one that drops a column need SQLite (they assert the driver).
        run: php -d memory_limit=-1 vendor/bin/phpunit --exclude-group=slow,fresh-db
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: heimguard_test
          DB_USERNAME: heimguard
          DB_PASSWORD: secret

  # Static checks. `php -l` of every PHP file (fails on a syntax error, silent otherwise); Pint only reports for now
  # (the existing code may not follow it), so it does not fail the job.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip
          coverage: none

      - name: Syntax of every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "$output"
              status=1
            fi
          done < <(find app tests routes config database -name '*.php' -print0)
          exit "$status"

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('src/laravel/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint (code style, not blocking yet)
        run: vendor/bin/pint --test
        continue-on-error: true

  build:
    needs: [tests, slow, lint]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
