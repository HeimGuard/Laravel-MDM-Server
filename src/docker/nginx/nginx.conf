worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 20m;

    client_body_temp_path /var/lib/nginx/tmp/body;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8000;
        root /var/www/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Reverb (WebSocket for agents and its HTTP API for the app) on the same port as the web.
        location /app/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /apps/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            # Writing a script with AI takes up to a few minutes.
            fastcgi_read_timeout 300s;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
