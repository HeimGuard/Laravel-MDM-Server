# Receives syslog (RFC 3164 and 5424) from other servers and devices and hands every message, as a line of JSON,
# to the portal (mdm-syslog-ingest -> php artisan mdm:syslog-ingest). It runs as the app user, so the ports are
# 5514; Docker publishes them as 514 (docker-compose: "514:5514/udp", "514:5514/tcp").
global(workDirectory="/tmp" maxMessageSize="16k")

module(load="imudp")
module(load="imtcp")
module(load="omprog")

input(type="imudp" port="5514")
input(type="imtcp" port="5514")

template(name="mdm" type="list" option.jsonf="on") {
    property(outname="ip" name="fromhost-ip" format="jsonf")
    property(outname="time" name="timereported" dateFormat="rfc3339" format="jsonf")
    property(outname="host" name="hostname" format="jsonf")
    property(outname="facility" name="syslogfacility-text" format="jsonf")
    property(outname="severity" name="syslogseverity-text" format="jsonf")
    property(outname="app" name="programname" format="jsonf")
    property(outname="pid" name="procid" format="jsonf")
    property(outname="msg" name="msg" format="jsonf")
}

action(type="omprog" name="mdm" binary="/usr/local/bin/mdm-syslog-ingest" template="mdm"
       queue.type="LinkedList" queue.size="20000" queue.discardMark="19000" queue.discardSeverity="7"
       action.resumeRetryCount="-1" closeTimeout="10000" killUnresponsive="on")
