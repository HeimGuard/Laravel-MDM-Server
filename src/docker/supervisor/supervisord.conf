[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; All programs log to the container output.
[program:php-fpm]
command=php-fpm84 --nodaemonize
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -e stderr -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:reverb]
; only reachable through nginx (/app, /apps)
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www
autostart=%(ENV_REVERB_ENABLED)s
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:queue]
; background jobs (security collections of the agents); the queue is the database unless QUEUE_CONNECTION says otherwise
command=php artisan queue:work --queue=security,default --sleep=3 --tries=3 --max-time=3600
directory=/var/www
autostart=%(ENV_QUEUE_ENABLED)s
autorestart=true
stopwaitsecs=330
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:syslog]
; syslog from other servers and devices (UDP and TCP 5514); hands the messages to php artisan mdm:syslog-ingest
command=rsyslogd -n -f /etc/mdm-rsyslog.conf -i /tmp/rsyslogd.pid
autostart=%(ENV_SYSLOG_ENABLED)s
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php artisan schedule:work
directory=/var/www
autostart=%(ENV_SCHEDULER_ENABLED)s
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
