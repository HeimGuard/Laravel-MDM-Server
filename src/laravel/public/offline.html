<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="#f9fbfc" name="theme-color">
    <title>HeimGuard · Offline</title>
    <style>
        :root { color-scheme: light dark; --bg: #f9fbfc; --fg: #1f2937; --muted: #6b7280; --tile: #bae6fd; --icon: #0c4a6e; }
        @media (prefers-color-scheme: dark) { :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --tile: #075985; --icon: #e0f2fe; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1rem; box-sizing: border-box; }
        .tile { width: 4rem; height: 4rem; border-radius: 1rem; background: var(--tile); color: var(--icon); display: grid; place-items: center; margin: 0 auto 1rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { color: var(--muted); margin: 0 0 1.25rem; }
        button { font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 0; background: #0d6efd; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div class="tile" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <h1>The server is not reachable</h1>
        <p>HeimGuard needs a connection to the server. Check your network and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
