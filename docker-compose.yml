# docker compose up -d, then open http://localhost:8000 and create the first account.
# SQLite, keys and logs are kept in the storage volume. For MySQL see docker-compose.mysql.yml.
services:
  mdm:
    image: ghcr.io/heimguard/laravel-mdm-server:latest
    container_name: mdm
    ports:
      - "8000:8000" # web and agent WebSocket (/app)
      - "514:5514/udp"  # syslog from other servers and devices (only from the IP addresses of devices)
      - "514:5514/tcp"
    volumes:
      - storage:/var/www/storage
    restart: unless-stopped

volumes:
  storage:
